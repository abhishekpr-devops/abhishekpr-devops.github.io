<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Abhishek P R</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #0a0e14;
      color: #e6edf3;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .box { max-width: 500px; }
    .prompt { color: #00d4aa; margin-bottom: 16px; }
    .prompt::before { content: '$ '; color: #8b98a9; }
    h1 { font-size: 48px; margin-bottom: 12px; }
    p { color: #8b98a9; line-height: 1.6; margin-bottom: 24px; }
    a {
      color: #00d4aa;
      text-decoration: none;
      border: 1px solid #1f2937;
      padding: 10px 18px;
      border-radius: 8px;
      display: inline-block;
      transition: border-color .2s;
    }
    a:hover { border-color: #00d4aa; }
  </style>
</head>
<body>
  <div class="box">
    <div class="prompt">cat /var/www/404.html</div>
    <h1>404</h1>
    <p>No such file or directory. The page you're looking for doesn't exist or has moved.</p>
    <a href="/">← cd ~/home</a>
  </div>
</body>
</html>
